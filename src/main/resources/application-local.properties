# Banco local
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/inscricoesdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true

# Console H2 local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auditoria local
auditoria.arquivo=${AUDITORIA_ARQUIVO:./logs/auditoria-inscricoes.jsonl}

# RabbitMQ local
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:eventos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:eventos123}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

# Detalhes de saude para desenvolvimento
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always