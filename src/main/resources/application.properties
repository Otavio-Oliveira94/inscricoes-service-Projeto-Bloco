spring.application.name=inscricoes-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:inscricoesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

servicos.eventos.url=http://localhost:8080

spring.cloud.openfeign.client.config.eventos-service.connectTimeout=2000
spring.cloud.openfeign.client.config.eventos-service.readTimeout=3000