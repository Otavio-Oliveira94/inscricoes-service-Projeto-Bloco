spring.application.name=inscricoes-service
server.port=8081

#H2
spring.datasource.url=jdbc:h2:file:./data/inscricoesdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

servicos.eventos.url=http://localhost:8080

spring.cloud.openfeign.client.config.eventos-service.connectTimeout=2000
spring.cloud.openfeign.client.config.eventos-service.readTimeout=3000

# Historico de alteracoes em arquivo, independente do banco H2.
auditoria.arquivo=${AUDITORIA_ARQUIVO:./logs/auditoria-inscricoes.jsonl}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=eventos
spring.rabbitmq.password=eventos123
spring.rabbitmq.virtual-host=/